syntax = "proto3";

package echo;

option go_package = "github.com/PhilipSchmid/echo-observatory/v2/proto";

service EchoService {
  rpc Echo (EchoRequest) returns (EchoResponse) {}
}

message EchoRequest {}

message EchoResponse {
  string timestamp = 1;
  string message = 2;
  string hostname = 3;
  string listener = 4;
  string node = 5;
  string source_ip = 6;
  string grpc_method = 7;
  string ip_version = 8;
  string socket_peer_ip = 9;
  string socket_peer_ip_version = 10;
  string socket_peer_addr = 11;
}
